<h1>Search Spotify</h1>

<input [(ngModel)]="searchString" (keyup.enter)="search()">

<select [(ngModel)]="searchCategory" (change)="search()">
	<option *ngFor="let category of searchCategories" [value]="category">{{category}}</option>
</select>

<button class="btn btn-light" (click)="search()">Search</button>

<app-carousel *ngIf="resources && searchCategory !== 'track'" [resources]="resources" carouselId="search"></app-carousel>

<app-track-list *ngIf="resources && searchCategory === 'track'" [tracks]="resources"></app-track-list>
